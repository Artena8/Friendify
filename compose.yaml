version: '3.8'

services:
  api:
    build:
      context: ./backend  
    volumes:
      - ./backend:/app  
    container_name: api
    restart: unless-stopped
    init: true
    env_file: ./backend/.env  
    ports:
      - "8000:8000" 
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]  
      interval: 30s  
      timeout: 10s    
      start_period: 10s 
      retries: 3  

    networks:
      - app-network  
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  

  tests:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    depends_on:
      - api
    networks:
      - app-network
    command: pytest

networks:
  app-network:
    driver: bridge 
