services:
  api:
    build:
      context: ./backend  
    volumes:
      - ./backend:/app  
    container_name: api
    restart: unless-stopped
    init: true
    env_file: ./backend/.env  
    ports:
      - "8000:8000" 
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]  
      interval: 30s  
      timeout: 10s    
      start_period: 10s 
      retries: 3  
    networks:
      - app-network  
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  

  tests:
    container_name: test-api
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    depends_on:
      - api
    networks:
      - app-network
    command: pytest

  database:
    container_name: database
    image: mysql:latest
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: database
      MYSQL_USER: user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_TCP_PORT: 3306
    ports:
      - 3307:3306
    volumes:
      - my-db-volume:/var/lib/mysql
    secrets:
      - mysql_password
      - mysql_root_password
    networks:
      - app-network

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: database
      MYSQL_USER: user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    ports:
      - 8080:80
    depends_on:
      - database
    secrets:
      - mysql_password
      - mysql_root_password
    networks:
      - app-network

secrets:
  mysql_password:
    file: ./mysql_password.txt
  mysql_root_password:
    file: ./mysql_root_password.txt

volumes:
  my-db-volume:
  
networks:
  app-network:
    driver: bridge
